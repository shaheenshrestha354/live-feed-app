<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slitscan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Slitscan</h1>
    <nav class="nav">
      <a href="index.html">Live Feed</a>
    </nav>
    <span id="status" class="status offline">Offline</span>
  </header>

  <main>
    <p class="hint">Each frame, a thin strip from the center of the camera is stacked over time &mdash; the further from the edge, the further in the past.</p>

    <div class="video-wrap">
      <canvas id="scanCanvas"></canvas>
      <video id="video" autoplay playsinline muted class="pip"></video>
      <p id="message" class="message"></p>
    </div>

    <div class="controls">
      <select id="cameraSelect"></select>
      <select id="orientationSelect">
        <option value="vertical">Vertical slit (scrolls left)</option>
        <option value="horizontal">Horizontal slit (scrolls up)</option>
      </select>
    </div>

    <div class="controls">
      <label class="slider-label">Slit width: <span id="widthLabel"></span>
        <input type="range" id="widthSlider" min="1" max="20" value="3">
      </label>
      <label class="slider-label">Scan speed: <span id="speedLabel"></span>
        <input type="range" id="speedSlider" min="16" max="300" step="4" value="40">
      </label>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="resetBtn" disabled>Reset</button>
      <button id="saveBtn" disabled>Save PNG</button>
    </div>
  </main>

  <script src="slitscan.js"></script>
</body>
</html>
