<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Swirl</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hand Swirl</h1>
    <nav class="nav">
      <a href="index.html">Live Feed</a>
      <a href="slitscan.html">Slitscan</a>
      <a href="wink.html">Wink Words</a>
    </nav>
    <span id="status" class="status offline">Offline</span>
  </header>

  <main>
    <p class="hint">Tracks your hand and warps the video into a swirl centered on it. Uses Google's MediaPipe Hand Landmarker, running entirely in your browser &mdash; the first load downloads a small ML model, so it needs an internet connection once.</p>

    <div class="video-wrap" id="videoWrap">
      <canvas id="swirlCanvas"></canvas>
      <video id="video" autoplay playsinline muted class="pip"></video>
      <p id="message" class="message"></p>
      <button id="exitFullscreenBtn" class="exit-fullscreen hidden">✕ Exit Fullscreen</button>
    </div>

    <div class="controls">
      <select id="cameraSelect"></select>
      <label class="checkbox-label"><input type="checkbox" id="showLandmarks" checked> Show hand tracking</label>
      <button id="fullscreenBtn">Fullscreen</button>
    </div>

    <div class="controls">
      <label class="slider-label">Swirl strength: <span id="strengthLabel"></span>
        <input type="range" id="strengthSlider" min="0" max="12" step="0.5" value="6">
      </label>
      <label class="slider-label">Swirl radius: <span id="radiusLabel"></span>
        <input type="range" id="radiusSlider" min="40" max="220" step="10" value="120">
      </label>
    </div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <button id="saveBtn" disabled>Save PNG</button>
    </div>
  </main>

  <script type="module" src="swirl.js"></script>
</body>
</html>
